baseURL = "https://sandbox-notes.github.io/"
title = "Sandbox Notes"
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[languages]
  [languages.ko]
    label = "한국어"
    locale = "ko-KR"
    contentDir = "content/ko"
    weight = 1
    title = "샌드박스 노트"
    [languages.ko.params]
      description = "격리 랩에서 악성코드를 직접 돌려보는 분석 기록"
      readmore = "더 보기"
      draftNotice = "초안"
      eyebrow = "격리 랩 · 실습 기록"
      recent = "최근 글"
      minRead = "분 읽기"
      consentText = "이 사이트는 광고와 방문 통계를 위해 쿠키를 사용할 수 있습니다. 동의하지 않아도 모든 글을 읽을 수 있습니다."
      consentAccept = "동의"
      consentReject = "거부"
      consentSettings = "쿠키 설정"
      privacyLabel = "개인정보 처리방침"
  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    title = "Sandbox Notes"
    [languages.en.params]
      description = "Hands-on malware analysis notes from an isolated lab"
      readmore = "Read more"
      draftNotice = "Draft"
      eyebrow = "Isolated lab · Field notes"
      recent = "Recent posts"
      minRead = "min read"
      consentText = "This site may use cookies for advertising and traffic statistics. You can read every post without accepting."
      consentAccept = "Accept"
      consentReject = "Reject"
      consentSettings = "Cookie settings"
      privacyLabel = "Privacy Policy"

[params]
  # AdSense 승인 후 게시자 ID(ca-pub-XXXXXXXXXXXXXXXX)를 넣으면 동의한 방문자에게만 광고 스크립트가 로드된다.
  # 비워 두면 광고 코드는 전혀 출력되지 않는다.
  adsenseClient = ""

[markup.goldmark.renderer]
  unsafe = false
